<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声波测距系统 (BeepBeep)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .config-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .role-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.9em;
            line-height: 1.6;
        }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        button {
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #6c757d;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .btn-success {
            background: #28a745;
        }
        .btn-success:hover {
            background: #218838;
        }
        .result-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }
        .distance-display {
            font-size: 4em;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .unit {
            font-size: 0.5em;
            opacity: 0.9;
        }
        .details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .detail-item {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 10px;
        }
        .detail-label {
            font-size: 0.85em;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        .detail-value {
            font-size: 1.3em;
            font-weight: bold;
        }
        .status {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.info { background: #d1ecf1; color: #0c5460; }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 1.1em;
            color: #667eea;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔊 声波测距系统</h1>
        <div class="subtitle">基于 BeepBeep 算法</div>
        
        <div class="config-section">
            <h3 style="margin-bottom: 15px;">📡 设备配置</h3>
            <div class="form-group">
                <label>设备角色：</label>
                <select id="role" onchange="updateRoleInfo()">
                    <option value="anchor">🔵 Anchor (锚节点 - 先发送)</option>
                    <option value="target">🟢 Target (目标设备 - 后发送)</option>
                </select>
            </div>
            <div class="form-group">
                <label>对方IP地址：</label>
                <input type="text" id="peerIp" placeholder="例如: 192.168.1.100">
            </div>
            <div class="role-info" id="roleInfo">
                <strong>🔵 Anchor模式:</strong><br>
                • 立即发送 4-6kHz chirp信号<br>
                • 接收对方的 6-8kHz chirp信号<br>
                • 请确保另一台设备设置为Target模式
            </div>
            <button class="btn-success" onclick="saveConfig()" style="width: 100%; margin-top: 15px;">💾 保存配置</button>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div class="button-group">
            <button class="btn-primary" onclick="startRanging()">🎯 开始测距</button>
            <button class="btn-secondary" onclick="testSignal('A')">🔊 测试信号A</button>
            <button class="btn-secondary" onclick="testSignal('B')">🔊 测试信号B</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">正在测距中，请保持安静...</div>
        </div>

        <div class="result-box" id="result" style="display: none;">
            <h3>📏 测距结果</h3>
            <div class="distance-display">
                <span id="distance">--</span>
                <span class="unit">m</span>
            </div>
            <div class="details">
                <div class="detail-item">
                    <div class="detail-label">本地采样点差</div>
                    <div class="detail-value"><span id="sampleLocal">--</span></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">对方采样点差</div>
                    <div class="detail-value"><span id="samplePeer">--</span></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Chirp A时间</div>
                    <div class="detail-value"><span id="timeA">--</span> s</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Chirp B时间</div>
                    <div class="detail-value"><span id="timeB">--</span> s</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateRoleInfo() {
            const role = document.getElementById('role').value;
            const roleInfo = document.getElementById('roleInfo');
            
            if (role === 'anchor') {
                roleInfo.innerHTML = `
                    <strong>🔵 Anchor模式:</strong><br>
                    • 立即发送 4-6kHz chirp信号<br>
                    • 接收对方的 6-8kHz chirp信号<br>
                    • 请确保另一台设备设置为Target模式
                `;
            } else {
                roleInfo.innerHTML = `
                    <strong>🟢 Target模式:</strong><br>
                    • 等待1.5秒后发送 6-8kHz chirp信号<br>
                    • 接收对方的 4-6kHz chirp信号<br>
                    • 请确保另一台设备设置为Anchor模式
                `;
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.innerHTML = message;
            status.className = 'status ' + type;
            status.style.display = 'block';
            setTimeout(() => status.style.display = 'none', 5001);
        }

        function saveConfig() {
            const role = document.getElementById('role').value;
            const peerIp = document.getElementById('peerIp').value;
            
            fetch('/set_config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({role: role, peer_ip: peerIp})
            })
            .then(res => res.json())
            .then(data => {
                showStatus('✅ 配置已保存！请在另一台设备上点击"开始测距"', 'success');
            });
        }

        function startRanging() {
            const peerIp = document.getElementById('peerIp').value;
            if (!peerIp) {
                showStatus('❌ 请先配置对方IP地址！', 'error');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            
            fetch('/start_ranging', {method: 'POST'})
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                
                if (data.error) {
                    showStatus('❌ ' + data.error, 'error');
                    return;
                }
                
                document.getElementById('result').style.display = 'block';
                document.getElementById('distance').textContent = data.distance || '--';
                document.getElementById('sampleLocal').textContent = data.sample_diff_local || '--';
                document.getElementById('samplePeer').textContent = data.sample_diff_peer || '--';
                document.getElementById('timeA').textContent = data.time_A || '--';
                document.getElementById('timeB').textContent = data.time_B || '--';
                
                showStatus('✅ 测距完成！距离: ' + data.distance + ' 米', 'success');
            })
            .catch(err => {
                document.getElementById('loading').style.display = 'none';
                showStatus('❌ 请求失败: ' + err.message, 'error');
            });
        }

        function testSignal(type) {
            fetch('/test_signal', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({type: type})
            })
            .then(res => res.json())
            .then(data => {
                showStatus(`🔊 测试信号${type}已发送！`, 'info');
            });
        }

        // 页面加载时更新角色信息
        updateRoleInfo();
    </script>
</body>
</html>
